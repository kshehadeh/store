version: 2

project_name: store

builds:
  - id: store
    main: ./cmd/store
    binary: store
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/kshehadeh/store/internal/cli.Version=v{{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

release:
  github:
    owner: kshehadeh
    name: store
  name_template: '{{ .Tag }}'
