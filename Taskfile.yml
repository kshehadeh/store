version: '3'

silent: true

vars:
  VERSION:
    sh: git describe --tags --match 'v[0-9]*' --always --dirty

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  fmt:
    desc: Format Go source
    cmds:
      - gofmt -w cmd internal scripts

  fmt:check:
    desc: Check Go formatting without modifying files
    cmds:
      - |
        files=$(gofmt -l cmd internal scripts)
        if [ -n "$files" ]; then
          printf 'Run task fmt on:\n%s\n' "$files" >&2
          exit 1
        fi

  mod:verify:
    desc: Verify downloaded modules
    cmds:
      - go mod verify

  test:
    desc: Run all tests with the race detector
    cmds:
      - go test -race ./...

  vet:
    desc: Run Go vet
    cmds:
      - go vet ./...

  build:
    desc: Build dist/store with its Git version
    cmds:
      - go build -trimpath -ldflags "-X github.com/kshehadeh/store/internal/cli.Version={{.VERSION}}" -o dist/store ./cmd/store

  run:
    desc: Build and run the CLI (task run -- pull)
    interactive: true
    cmds:
      - task: build
      - ./dist/store {{.CLI_ARGS}}

  check:
    desc: Run formatting, module verification, tests, vet, and build
    cmds:
      - task: fmt:check
      - task: mod:verify
      - task: test
      - task: vet
      - task: build

  release:check:
    desc: Validate GoReleaser configuration
    cmds:
      - goreleaser check

  release:snapshot:
    desc: Build release archives and checksums locally without publishing
    cmds:
      - task: check
      - task: release:check
      - goreleaser release --snapshot --clean --skip=publish

  release:patch:
    desc: Validate, increment the patch version, tag, and push (or pass -- --dry-run)
    cmds:
      - bash scripts/release.sh patch {{.CLI_ARGS}}

  release:minor:
    desc: Validate, increment the minor version, tag, and push (or pass -- --dry-run)
    cmds:
      - bash scripts/release.sh minor {{.CLI_ARGS}}

  release:major:
    desc: Validate, increment the major version, tag, and push (or pass -- --dry-run)
    cmds:
      - bash scripts/release.sh major {{.CLI_ARGS}}
